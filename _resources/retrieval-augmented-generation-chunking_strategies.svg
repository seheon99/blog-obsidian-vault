  <line x1="40" y1="78" x2="120" y2="78" stroke="rgb(83, 74, 183)" stroke-width="1"/>
  <line x1="40" y1="138" x2="120" y2="138" stroke="rgb(83, 74, 183)" stroke-width="1"/>
