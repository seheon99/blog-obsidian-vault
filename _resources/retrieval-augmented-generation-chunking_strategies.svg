  <text x="80" y="86" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">para</text>
  <text x="80" y="118" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">sent</text>
  <text x="80" y="148" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">sent</text>
  <text x="80" y="172" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">sent</text>
  <text x="80" y="194" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">sent</text>
