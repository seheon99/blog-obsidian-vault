</g>

<!-- Semantic -->
<g transform="translate(360, 20)">
  <text x="80" y="18" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="rgb(60, 52, 137)">Semantic</text>
