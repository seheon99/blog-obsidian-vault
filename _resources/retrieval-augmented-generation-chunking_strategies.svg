  <line x1="40" y1="160" x2="120" y2="160" stroke="rgb(83, 74, 183)" stroke-width="1"/>
  <rect x="40" y="160" width="80" height="14" fill="rgb(83, 74, 183)" opacity="0.25"/>
  <text x="80" y="171" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="9" fill="rgb(60, 52, 137)" font-weight="600">## Sub</text>
  <text x="80" y="78" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">section</text>
  <text x="80" y="138" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">section</text>
  <text x="80" y="188" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">section</text>
  <text x="80" y="225" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(95, 94, 90)">문서 구조 기반 분할</text>
