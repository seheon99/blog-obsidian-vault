  <line x1="40" y1="100" x2="120" y2="100" stroke="rgb(83, 74, 183)" stroke-width="2"/>
  <line x1="40" y1="160" x2="120" y2="160" stroke="rgb(83, 74, 183)" stroke-width="2"/>
  <line x1="40" y1="68" x2="120" y2="68" stroke="rgb(83, 74, 183)" stroke-width="0.5" stroke-dasharray="3,2"/>
