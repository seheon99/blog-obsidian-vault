<svg width="100%" viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">

<!-- Fixed-size -->
<g transform="translate(20, 20)">
  <text x="80" y="18" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="rgb(60, 52, 137)">Fixed-size</text>
  <rect x="40" y="40" width="80" height="160" rx="4" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <line x1="40" y1="80" x2="120" y2="80" stroke="rgb(83, 74, 183)" stroke-width="1"/>
  <line x1="40" y1="120" x2="120" y2="120" stroke="rgb(83, 74, 183)" stroke-width="1"/>
  <line x1="40" y1="160" x2="120" y2="160" stroke="rgb(83, 74, 183)" stroke-width="1"/>
  <text x="80" y="64" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">N tokens</text>
  <text x="80" y="104" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">N tokens</text>
  <text x="80" y="144" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">N tokens</text>
  <text x="80" y="184" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="10" fill="rgb(83, 74, 183)">N tokens</text>
