<svg width="100%" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- Indexing phase label -->
<text x="30" y="32" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="rgb(83, 74, 183)">Indexing phase (offline)</text>

<!-- Documents -->
<g>
  <rect x="30" y="50" width="110" height="60" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="85" y="76" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="rgb(60, 52, 137)">Documents</text>
  <text x="85" y="94" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(83, 74, 183)">PDF, HTML, MD</text>
</g>

<!-- Chunking -->
<g>
  <rect x="170" y="50" width="110" height="60" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="225" y="76" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="rgb(60, 52, 137)">Chunking</text>
  <text x="225" y="94" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(83, 74, 183)">split + overlap</text>
</g>

<!-- Embedding (indexing) -->
<g>
  <rect x="310" y="50" width="110" height="60" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="365" y="76" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="rgb(60, 52, 137)">Embedding</text>
  <text x="365" y="94" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(83, 74, 183)">model</text>
</g>

<!-- Vector Store -->
<g>
  <rect x="450" y="50" width="240" height="130" rx="10" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="570" y="80" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">Vector Store</text>
  <text x="570" y="102" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(15, 110, 86)">embeddings + chunks + metadata</text>
  <text x="570" y="130" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(15, 110, 86)" font-style="italic">ANN: HNSW, IVF, ScaNN</text>
  <text x="570" y="152" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(15, 110, 86)" font-style="italic">pgvector, Qdrant, Pinecone, Milvus</text>
</g>

<!-- Indexing arrows -->
<line x1="140" y1="80" x2="170" y2="80" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="280" y1="80" x2="310" y2="80" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="80" x2="450" y2="80" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Query phase label -->
<text x="30" y="232" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="rgb(24, 95, 165)">Query phase (online)</text>

<!-- User Query -->
<g>
  <rect x="30" y="250" width="110" height="60" rx="8" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)" stroke-width="0.5"/>
  <text x="85" y="276" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="rgb(12, 68, 124)">User Query</text>
  <text x="85" y="294" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(24, 95, 165)">+ rewriting</text>
</g>

<!-- Retrieval -->
<g>
  <rect x="170" y="250" width="110" height="60" rx="8" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)" stroke-width="0.5"/>
  <text x="225" y="276" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="rgb(12, 68, 124)">Retrieval</text>
  <text x="225" y="294" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(24, 95, 165)">hybrid + filter</text>
</g>

<!-- Reranker -->
<g>
  <rect x="310" y="250" width="110" height="60" rx="8" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)" stroke-width="0.5"/>
  <text x="365" y="276" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="rgb(12, 68, 124)">Reranker</text>
  <text x="365" y="294" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(24, 95, 165)">cross-encoder</text>
</g>

<!-- LLM -->
<g>
  <rect x="450" y="250" width="110" height="60" rx="8" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)" stroke-width="0.5"/>
  <text x="505" y="276" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="rgb(113, 43, 19)">LLM</text>
  <text x="505" y="294" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(153, 60, 29)">+ system prompt</text>
</g>

<!-- Answer -->
<g>
  <rect x="590" y="250" width="100" height="60" rx="8" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)" stroke-width="0.5"/>
  <text x="640" y="276" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="rgb(113, 43, 19)">Answer</text>
  <text x="640" y="294" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(153, 60, 29)">+ citation</text>
</g>

<!-- Query arrows -->
<line x1="140" y1="280" x2="170" y2="280" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="280" y1="280" x2="310" y2="280" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="280" x2="450" y2="280" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560" y1="280" x2="590" y2="280" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Vector Store down to Retrieval (cross-phase) -->
<path d="M460 180 L460 215 L225 215 L225 250" fill="none" stroke="rgb(15, 110, 86)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text x="345" y="208" text-anchor="middle" font-family="Anthropic Sans, -apple-system, system-ui, Segoe UI, sans-serif" font-size="11" fill="rgb(15, 110, 86)" font-style="italic">top-k similarity search</text>

</svg>
